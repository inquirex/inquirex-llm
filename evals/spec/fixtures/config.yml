# A fixed lineup for the launcher specs, independent of the working config.yml.
project: inquirex-llm-extract
defaults:
  effort: default
  temperature: 0.2
  max_tokens: 4096
  parallelism: 4
vendors:
  anthropic:
    - model: claude-haiku-5.5
      effort: [default, low]
  openai:
    - model: gpt-4o-mini
  typesafe:
    - model: jev-router
  typesafe-api:
    - model: jev-latest
